# Build settings: how pip / uv turn this folder into an installable package.
[build-system]
requires = ["setuptools>=77"]          # 77+ understands the SPDX `license` field below
build-backend = "setuptools.build_meta"

# Package information shown on PyPI.
[project]
name = "pyRealEstate"
version = "0.3.0"
description = "Ratio studies, time trending, and data preprocessing for mass appraisal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Joshua Jorgensen" },
]
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Libraries installed together with pyRealEstate.
dependencies = [
    "lightgbm",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
]

[project.urls]
Homepage = "https://github.com/Joshua-Data-Wizard/PyRealEstate"
Documentation = "https://github.com/Joshua-Data-Wizard/PyRealEstate/wiki"
Issues = "https://github.com/Joshua-Data-Wizard/PyRealEstate/issues"
Source = "https://github.com/Joshua-Data-Wizard/PyRealEstate"

# The one package folder that ships in the wheel.
[tool.setuptools]
packages = ["pyRealEstate"]
